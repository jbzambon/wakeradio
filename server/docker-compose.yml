# Wake Radio: Caddy (HTTPS) -> oauth2-proxy (Google sign-in) -> Rdio Scanner.
# Values come from .env next to this file (written by setup.sh).

name: wakeradio

# Cap container logs (sign-in logs hold emails/IPs; keep them bounded).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  web:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Private link between Caddy and the /users page (and Caddy's admin API).
  adm:
    ipam:
      config:
        - subnet: 172.29.0.0/29

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${DOMAIN}
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ACME_EMAIL: ${ADMIN_EMAIL}
      CADDY_ADMIN_LISTEN: 172.29.0.2:2019
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    networks:
      web: {}
      adm:
        ipv4_address: 172.29.0.2
    depends_on: [oauth2-proxy, rdio-scanner, users-admin, alias-learner]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    restart: unless-stopped
    logging: *logging
    user: "65532:65532"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_NAME: _wakeradio
      OAUTH2_PROXY_COOKIE_EXPIRE: 720h          # stay signed in for 30 days
      OAUTH2_PROXY_REDIRECT_URL: https://${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${DOMAIN}
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: 172.28.0.0/24
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_APPROVAL_PROMPT: auto
      # Sign-in log to a file the /users page can read; per-request lines off.
      OAUTH2_PROXY_LOGGING_FILENAME: /var/log/oauth2-proxy/oauth2-proxy.log
      OAUTH2_PROXY_LOGGING_MAX_SIZE: "5"
      OAUTH2_PROXY_LOGGING_MAX_BACKUPS: "1"
      OAUTH2_PROXY_LOGGING_MAX_AGE: "30"
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
    volumes:
      # Whole folder, so edits to the list are picked up without a restart.
      - ./auth:/etc/oauth2-proxy:ro
      - ./logs:/var/log/oauth2-proxy
    networks: [web]

  rdio-scanner:
    # Rdio Scanner v6.6.3 (Nov 2022), the last release before the 2026
    # WebSocket licensing change. Pinned by digest so it can never drift.
    image: chuot/rdio-scanner@sha256:aa3bd0b5137580e813836f7e0705af7d66412a28bc73f912c95eacbe70bcd4ef
    restart: unless-stopped
    logging: *logging
    user: "1000:1000"
    environment:
      TZ: America/New_York
    ports:
      # Loopback only, for rdio-admin.py on this machine. Never exposed publicly.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/rdio:/app/data
    networks: [web]

  alias-learner:
    # Forwards each upload to Rdio unchanged and learns P25 talker aliases into
    # Rdio's unit labels (server/alias-learner/app.py, Python stdlib only).
    image: python:3.12-alpine
    restart: unless-stopped
    logging: *logging
    user: "65532:65532"
    read_only: true
    command: ["python3", "-u", "/app/app.py"]
    environment:
      RDIO_URL: http://rdio-scanner:3000
      RDIO_ADMIN_PASSWORD: ${RDIO_ADMIN_PASSWORD:-}
      PORT: "8090"
      STATE_FILE: /data/aliases.json
      DEBOUNCE_SECONDS: "5"
    volumes:
      - ./alias-learner/app.py:/app/app.py:ro
      - ./data/alias-learner:/data
    depends_on: [rdio-scanner]
    networks: [web]

  users-admin:
    # The /users listener page (server/users-admin/app.py, Python stdlib only).
    image: python:3.12-alpine
    restart: unless-stopped
    logging: *logging
    user: "65532:65532"
    read_only: true
    command: ["python3", "-u", "/app/app.py"]
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      CADDY_ADMIN: http://172.29.0.2:2019
      EMAILS_FILE: /data/auth/allowed-emails.txt
      LOG_DIR: /data/logs
    volumes:
      - ./users-admin/app.py:/app/app.py:ro
      - ./auth:/data/auth
      - ./logs:/data/logs:ro
    networks:
      adm:
        ipv4_address: 172.29.0.3   # fixed, so it can never take Caddy's address
